server {

    listen 80;

    server_name becharkh.com www.becharkh.com;

    root /var/www/public;

    index index.php index.html;

    # آپلود عکس/ویدیو (VideoController, ItemImageController, AffilateController و ...)
    client_max_body_size 300M;
    client_body_timeout 300s;

    # crawl/ffmpeg و کارهای سنگین ممکنه طول بکشه
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }

    # sitemap ها و فایل‌های استاتیک با کش طولانی
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js)$ {
        expires 7d;
        access_log off;
    }
}